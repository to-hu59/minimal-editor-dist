<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14110f" id="themeColor">
<title>演出をつくる</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Klee+One:wght@400;600&family=Shippori+Mincho:wght@400;600&family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fx.css">
<style>
  #fxBack { display: inline-flex; align-items: center; gap: 4px; }
  #cover { display: none !important; }
  .nav { display: none !important; }
  #mkBar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 70; display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: #14110fee; border-top: 1px solid #ffffff22; }
  #mkBar button { flex: 1; min-height: 46px; border-radius: 12px; border: 1px solid #ffffff44; background: #2a241f; color: #f1e8d6; font: 700 14px/1 sans-serif; }
  #mkBar button.main { background: #b8923f; border-color: #b8923f; color: #1b140c; }
  .stage { padding-bottom: 76px; }
  .sheet { bottom: calc(76px + env(safe-area-inset-bottom)); }
</style>
</head>
<body>
<!-- 演出をつくる：演出の見本を開いて、画面を触って直し、本文に入れる（または、この作品の演出として保存する）。
     エンジンは fxdemo の fx.js。「書き方」から、画面で直接直したり、入力欄で直したりできる。
   親 → ここ  { type:'fx-make', src:'［ ］の印つきの見本', title:'' }
   ここ → 親  { type:'fx-ready' } / { type:'fx-insert', src } / { type:'fx-save', src } / { type:'fx-close' } -->
<div class="app" id="app">
  <header class="hd">
    <button class="hbtn" id="fxBack" type="button" aria-label="もどる">‹ もどる</button>
    <div class="ttl"></div>
    <button class="hbtn" id="srcBtn" type="button">書き方</button>
    <button class="hbtn" id="againBtn" type="button">もう一度</button>
    <label class="sw"><input type="checkbox" id="fxSw" checked><span class="tr" aria-hidden="true"></span><span>演出</span></label>
  </header>
  <main class="stage" id="stage">
    <div class="bg" id="bg"></div>
    <div class="shade" id="shade"></div>
    <div class="silw" id="silw"><div class="sil"></div></div>
    <article class="page" id="page"></article>
    <div class="vig" id="vig"></div>
  </main>
  <nav class="nav">
    <button type="button" id="prev">‹ 前へ</button>
    <div class="mid"></div>
    <button type="button" id="next">次へ ›</button>
  </nav>
</div>
<div class="fx" id="fx"></div>
<div id="mkBar"><button type="button" id="mkSave">この作品に保存</button><button type="button" id="mkInsert" class="main">本文に入れる</button></div>

<div class="cover" id="cover">
  <div class="cv"><div class="card"><div class="btns"><button class="yes" id="yes" type="button">はい</button><button class="no" id="no" type="button">いいえ</button></div></div></div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-label="このページの書き方">
  <div class="in">
    <div class="sh"><b>このページの書き方</b><button class="hbtn" id="sheetClose" type="button">閉じる</button></div>
    <p class="ex">［ ］が演出の印です。文はそのまま読めて、印のところで演出が動きます。</p>
    <pre id="srcView"></pre>
  </div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="warp" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.012 0.035" numOctaves="2" seed="3"/>
    <feDisplacementMap id="disp" in="SourceGraphic" scale="0" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<script>
(function () {
  const post = m => { try { parent.postMessage(m, '*'); } catch (e) {} };
  let loaded = false;
  const current = () => { window.LineMakerBridge?.flush(); try { if (typeof S !== 'undefined' && S.edit && typeof exitEdit === 'function') exitEdit(); } catch (e) {} return (BOOK.pages[0] || '').replace(/\n{3,}/g, '\n\n').trim(); };
  document.getElementById('fxBack').onclick = () => post({ type: 'fx-close' });
  document.getElementById('mkInsert').onclick = () => { try { post({type:'fx-insert',src:current()}); } catch(e) { alert(e.message); } };
  document.getElementById('mkSave').onclick = () => { try { post({type:'fx-save',src:current()}); } catch(e) { alert(e.message); } };
  window.addEventListener('message', e => {
    const d = e.data; if (!d || d.type !== 'fx-make' || loaded) return;
    loaded = true;
    window.BOOK = { start: 1, silDefault: false, showTitle: false, pages: [d.src || '（見本がありません）'] };
    try { Object.defineProperty(navigator, 'vibrate', { value: () => false, configurable: true }); } catch (x) {}
    const s = document.createElement('script'); s.src = 'fx.js';
    s.onload = () => {
      const bridge = document.createElement('script'); bridge.src = 'line-maker-bridge.js';
      bridge.onload = () => {
      try {
        S.pvMute = true;
        document.querySelector('.hd .ttl').textContent = d.title || '';
        document.getElementById('yes').click();
        if (d.edit) {
          let attempts=0; const openEditorTimer=setInterval(() => {
            if (++attempts>200 || !document.body.isConnected) {clearInterval(openEditorTimer);return;}
            if (S.cur===0 && document.querySelector('#page .blk')) {clearInterval(openEditorTimer);document.getElementById('srcBtn').click();}
          },50);
          window.addEventListener('pagehide',()=>clearInterval(openEditorTimer),{once:true});
        }
      } catch (x) { post({ type: 'fx-error', message: String(x && x.message || x) }); }
    };
      bridge.onerror = () => post({ type: 'fx-error', message: 'トークメーカーの接続を読み込めませんでした' });
      document.body.appendChild(bridge);
    };
    s.onerror = () => post({ type: 'fx-error', message: 'fx.js を読み込めませんでした' });
    document.body.appendChild(s);
  });
  post({ type: 'fx-ready' });
})();
</script>
</body>
</html>
