  st.querySelectorAll('.tl-m').forEach(el => {
    const i = +el.dataset.m, l = p.lines[i] || '', c = document.createElement('div'); c.className = 'ctl';
    c.innerHTML = '<button type="button" data-op="bg" data-i="' + i + '">🎨 背景</button><button type="button" data-op="photo" data-i="' + i + '">📷 ' + (optOf(l, '写真') ? '写真をはずす' : '写真') + '</button><button type="button" data-op="igonly" data-i="' + i + '">' + (optOf(l, '出す') === 'インスタ' ? 'インスタだけ ✓' : 'インスタだけ') + '</button>';
    el.append(c);
  });
  st.querySelectorAll('.tl-sv[data-v]').forEach(el => {
    const i = +el.dataset.v, c = document.createElement('div'); c.className = 'ctl';
    c.innerHTML = '<button type="button" data-op="vbg" data-i="' + i + '">🎨 映像の背景</button>';
    el.prepend(c);
  });
  st.querySelectorAll('.tl-sc').forEach(el => {
    const i = +el.dataset.sh, c = document.createElement('div'); c.className = 'ctl';
    c.innerHTML = '<button type="button" data-op="sbg" data-i="' + i + '" title="背景の色">🎨</button><button type="button" data-op="addshort" data-i="' + i + '" title="となりにもう1つ">＋</button><button type="button" class="del" data-op="delshort" data-i="' + i + '" aria-label="このショートを消す">×</button>';
    el.prepend(c);
  });
  const look = lookOf();
  document.querySelectorAll('[data-look]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.look === look)));
  document.body.classList.toggle('dark', look === 'Xダーク');
  $('#btnUndo').disabled = !undo.length;
  window.scrollTo(0, y);
}

// ---------- 文字を直す（はなれたとき） ----------
const oneLine = k => !/:v2$/.test(k);   // 本文だけは改行できる
$('#stage').addEventListener('keydown', e => { const el = e.target.closest && e.target.closest('[data-e]'); if (!el) return; if (e.key === 'Enter' && !e.isComposing && oneLine(el.dataset.e)) { e.preventDefault(); el.blur(); } });
$('#stage').addEventListener('focusout', e => {
  const el = e.target.closest && e.target.closest('[data-e]'); if (!el || playing || rendering || !el.isConnected) return;
  const key = el.dataset.e, val = el.innerText.replace(/ /g, ' ').replace(/\n+$/, '');
  const to = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('[data-e]'), toKey = to && to.dataset.e;
  const next = NR.edit(src, key, val);
  if (next !== src) { change(next); if (toKey) { const n = $('#stage').querySelector('[data-e="' + toKey + '"]'); if (n) n.focus(); } }
});

// ---------- ボタン ----------
let pickAt = -1;
// ボタンを押しても、打っている所から離れない（先に、打った分を入れてから、ボタンの仕事をする）
$('#stage').addEventListener('mousedown', e => { if (e.target.closest('[data-op],[data-av],[data-tab],[data-fl]')) e.preventDefault(); });
function commit() {
  const el = document.activeElement; if (!el || !el.dataset || !el.dataset.e || !$('#stage').contains(el)) return;
  const next = NR.edit(src, el.dataset.e, el.innerText.replace(/ /g, ' ').replace(/\n+$/, ''));
  if (next !== src) { undo.push(src); src = next; }
  rendering = true; try { el.blur(); } finally { rendering = false; }
}
$('#stage').addEventListener('click', e => {
  if (playing) return;
  if (e.target.closest('[data-op],[data-av],[data-tab],[data-fl]')) commit();
  const tb = e.target.closest('[data-tab]');
  if (tb) { change(NR.edit(src, 'a:タブ', tb.dataset.tab === 'フォロー中' ? 'フォロー中' : '')); toast(tb.dataset.tab === 'フォロー中' ? '「フォロー中」のタブにしました' : '「おすすめ」のタブにしました。✨ の一行とフォローボタンが出ます'); return; }
  const fl = e.target.closest('[data-fl]');
  if (fl) { const i = +fl.dataset.fl; setOpt(i, 'フォロー', optOf(parts().lines[i] || '', 'フォロー') === '中' ? '' : '中'); return; }
  const av = e.target.closest('[data-av]');
  if (av) { const i = +av.dataset.av, l = parts().lines[i] || '', cols = NR.TL_COLS, cur = optOf(l, '色'); setOpt(i, '色', cols[(cols.indexOf(cur) + 1) % cols.length]); return; }
  const b = e.target.closest('[data-op]'); if (!b) return;
  e.preventDefault();
  const p = parts(), L = p.lines.slice(), i = +b.dataset.i, op = b.dataset.op;
  if (op === 'reply') { L.splice(postEnd(L, i), 0, '返信：返信する人｜@reply_user｜返信の本文を入れます｜時間=たった今'); setLines(p, L); toast('返信を足しました'); return; }
  if (op === 'sub') { let j = i + 1; while (j < L.length && kindOf(L[j]) === '返信の返信') j++; L.splice(j, 0, '返信の返信：返信する人｜@reply_user｜返信への返信を入れます｜時間=たった今'); setLines(p, L); toast('返信への返信を足しました'); return; }
  if (op === 'img') { const end = postEnd(L, i), k = L.slice(i + 1, end).findIndex(l => kindOf(l) === '画像'); if (k >= 0) L.splice(i + 1 + k, 1); else L.splice(i + 1, 0, '画像：📷 画像の説明｜くわしい説明｜背景=ステージ'); setLines(p, L); return; }
  if (op === 'letter') { const cur = optOf(L[i], '字'), v = prompt('アイコンに出す字（1文字。空にすると、名前のはじめの字）', cur); if (v == null) return; setOpt(i, '字', [...v.trim()][0] || ''); return; }
  if (op === 'up' || op === 'down') {
    const starts = []; L.forEach((l, j) => { if (kindOf(l) === '投稿') starts.push(j); });
    const k = starts.indexOf(i), k2 = op === 'up' ? k - 1 : k + 1; if (k < 0 || k2 < 0 || k2 >= starts.length) return;
    const a = Math.min(k, k2), seg = x => L.slice(starts[x], postEnd(L, starts[x]));
    const head = L.slice(0, starts[a]), A = seg(a), B = seg(a + 1), tail = L.slice(postEnd(L, starts[a + 1]));
    setLines(p, head.concat(B, A, tail)); return;
  }
  if (op === 'delpost') { const end = postEnd(L, i); if (end - i > 1 && !confirm('この投稿と、ついている返信を消します。よいですか？（「↶ もどす」で戻せます）')) return; L.splice(i, end - i); setLines(p, L); toast('投稿を消しました'); return; }
  if (op === 'shorts') { const end = postEnd(L, i), ks = []; for (let j = i + 1; j < end; j++) if (kindOf(L[j]) === 'ショート') ks.push(j); if (ks.length) { if (ks.length > 1 && !confirm('この投稿のショートを、ぜんぶはずします。よいですか？（「↶ もどす」で戻せます）')) return; ks.reverse().forEach(j => L.splice(j, 1)); setLines(p, L); toast('ショートをはずしました'); return; } let at = i + 1; while (at < end && kindOf(L[at]) === '画像') at++; L.splice(at, 0, 'ショート：ショートの題名を入れます｜100万回視聴｜背景=紺', 'ショート：ショートの題名を入れます｜50万回視聴｜背景=赤', 'ショート：ショートの題名を入れます｜30万回視聴｜背景=青緑'); setLines(p, L); toast('ショートを3つ足しました。題名と回数を押して直せます'); return; }
  if (op === 'algo') { const cur = optOf(L[i], 'おすすめ'); setOpt(i, 'おすすめ', cur ? '' : '韓国ドラマ・トレンド · おすすめ表示'); if (!cur && /^X/.test(lookOf()) && (src.match(/タブ=フォロー中/))) toast('「おすすめ」のタブのときに出ます'); return; }
  if (op === 'vbg') { const bgs = NR.TL_VBG, cur = optOf(L[i], '背景') || bgs[0]; setOpt(i, '背景', bgs[(bgs.indexOf(cur) + 1) % bgs.length]); return; }
  if (op === 'sbg') { const bgs = NR.TL_SBG, cur = optOf(L[i], '背景') || bgs[0]; setOpt(i, '背景', bgs[(bgs.indexOf(cur) + 1) % bgs.length]); return; }
  if (op === 'addshort') { L.splice(i + 1, 0, 'ショート：ショートの題名を入れます｜10万回視聴｜背景=紺'); setLines(p, L); return; }
  if (op === 'delshort') { L.splice(i, 1); setLines(p, L); toast('ショートを消しました'); return; }
  if (op === 'delrow') { L.splice(i, 1); setLines(p, L); toast('返信を消しました'); return; }
  if (op === 'bg') { const bgs = NR.TL_BG, cur = optOf(L[i], '背景') || bgs[0]; setOpt(i, '背景', bgs[(bgs.indexOf(cur) + 1) % bgs.length]); return; }
  if (op === 'igonly') { setOpt(i, '出す', optOf(L[i], '出す') === 'インスタ' ? '' : 'インスタ'); toast(optOf(parts().lines[i], '出す') ? 'インスタの見た目のときだけ出ます' : 'どの見た目でも出ます'); return; }
  if (op === 'photo') { if (optOf(L[i], '写真')) { setOpt(i, '写真', ''); return; } pickAt = i; $('#photoFile').click(); return; }
});
// 画像を小さくする（横 720px まで、JPEG）。本文の印に入るので、大きいままにしない
function shrinkPhoto(file) { return new Promise((ok, ng) => { const r = new FileReader(); r.onerror = ng; r.onload = () => { const im = new Image(); im.onerror = ng; im.onload = () => { const w = Math.min(720, im.naturalWidth), h = Math.round(im.naturalHeight * w / im.naturalWidth), c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(im, 0, 0, w, h); ok(c.toDataURL('image/jpeg', 0.78)); }; im.src = r.result; }; r.readAsDataURL(file); }); }
$('#photoFile').addEventListener('change', e => { const file = e.target.files && e.target.files[0], i = pickAt; e.target.value = ''; if (!file || i < 0) return; shrinkPhoto(file).then(url => setOpt(i, '写真', url)).catch(() => alert('この画像は読み込めませんでした')); });
$('#looks').addEventListener('click', e => {
  const b = e.target.closest('[data-look]'); if (!b) return;
  let next = NR.edit(src, 'a:見た目', b.dataset.look);
  if (/ショート|リール/.test(b.dataset.look)) {
    const m = next.match(/^([^\n]*)\n([\s\S]*)\n［／報道］\s*$/);
    if (m) {
      const L = m[2].split('\n'); let added = 0;
      for (let i = L.length - 1; i >= 0; i--) { if (kindOf(L[i]) !== '投稿') continue; const end = postEnd(L, i); if (L.slice(i + 1, end).some(l => kindOf(l) === '動画')) continue; L.splice(i + 1, 0, '動画：🎬 場面の題を入れます｜場面の下の字｜背景=紺'); added++; }
      if (added) { next = m[1] + '\n' + L.join('\n') + '\n［／報道］'; setTimeout(() => toast('動画の場面を ' + added + 'つ足しました。題と下の字を押して直せます'), 50); }
    }
  }
  change(next);
});
$('#btnAdd').onclick = () => { const p = parts(), L = p.lines.slice(); L.push('投稿：ユーザー名｜@new_user｜ここに投稿の本文を入れます｜時間=たった今｜返信=0｜RP=0｜いいね=0'); setLines(p, L); toast('投稿を足しました'); setTimeout(() => { const ps = document.querySelectorAll('#stage .tl-p'); ps[ps.length - 1]?.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 30); };
$('#scene').onchange = e => { const k = e.target.value; e.target.value = ''; if (!k) return; if (!confirm('今の中身を、見本と入れかえます。よいですか？（「↶ もどす」で戻せます）')) return; change(SCENES[k]); toast('見本を読みこみました'); };
$('#btnUndo').onclick = () => { if (!undo.length) return; src = undo.pop(); render(); };

// ---------- 再生してみる（読む画面と同じ動き） ----------
function stopPlay() { if (!playing) return; const h = playing; playing = null; try { h.cancel(); } catch (e) {} $('#btnPlay').textContent = '▶ 再生してみる'; render(); }
$('#btnPlay').onclick = () => {
  if (playing) { stopPlay(); return; }
  const st = $('#stage'); st.classList.remove('ed'); st.innerHTML = NR.html(src, { base: '' });
  $('#btnPlay').textContent = '■ 止めて直す'; st.scrollIntoView({ behavior: 'smooth' });
  let h = null; h = playing = NR.play(st, { sound: $('#snd').checked, done: () => setTimeout(() => { if (playing === h) { playing = null; $('#btnPlay').textContent = '▶ 再生してみる'; render(); } }, 2200) });
};

$('#btnBack').onclick = () => post({ type: 'fx-close' });
$('#btnInsert').onclick = () => { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); post({ type: 'fx-insert', src: src.trim() }); };
$('#btnSave').onclick = () => { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); post({ type: 'fx-save', src: src.trim() }); };
let loaded = false;
window.addEventListener('message', e => {
  const d = e.data || {}; if (e.source !== parent || d.type !== 'fx-make' || loaded) return;
  loaded = true; if (d.src && TL_RE.test(String(d.src).trim()) && NR.isSource(String(d.src).trim())) src = String(d.src).trim(); if (d.title) title = d.title; render();
});
window.TimelineMaker = { get src() { return src; }, set: s => { src = s; render(); }, SCENES };
render();
if (parent !== window) post({ type: 'fx-ready' });
})();
</script>
</body>
