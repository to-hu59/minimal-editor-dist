<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14110f" id="themeColor">
<title>演出ビュー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Klee+One:wght@400;600&family=Shippori+Mincho:wght@400;600&family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fx.css">
<style>
  #fxBack { display: inline-flex; align-items: center; gap: 4px; }
  #srcBtn { display: none !important; }
  #cover { display: none !important; }
</style>
<link rel="stylesheet" href="document-style.css">
<script src="document-core.js"></script>
<script src="document-motion.js"></script>
</head>
<body>
<!-- 演出ビュー：読む画面から、章の本文（［ ］の印つき）を受け取って、演出つきで読む。
     エンジンは fxdemo の fx.js（tools/sync-fx.mjs で写したもの）。本文は postMessage で受け取る。 -->
<div class="app" id="app">
  <header class="hd">
    <button class="hbtn" id="fxBack" type="button" aria-label="本文にもどる">‹ 本文へ</button>
    <div class="ttl"></div>
    <button class="hbtn" id="srcBtn" type="button">書き方</button>
    <label class="sw"><input type="checkbox" id="fxSw" checked><span class="tr" aria-hidden="true"></span><span>演出</span></label>
  </header>
  <main class="stage" id="stage">
    <div class="bg" id="bg"></div>
    <div class="shade" id="shade"></div>
    <div class="silw" id="silw"><div class="sil"></div></div>
    <article class="page" id="page"></article>
    <div class="vig" id="vig"></div>
  </main>
  <nav class="nav">
    <button type="button" id="prev">‹ 前へ</button>
    <div class="mid">左右にスワイプでもめくれます</div>
    <button type="button" id="next">次へ ›</button>
  </nav>
</div>
<div class="fx" id="fx"></div>

<div class="cover" id="cover">
  <div class="cv"><div class="card"><div class="btns"><button class="yes" id="yes" type="button">はい</button><button class="no" id="no" type="button">いいえ</button></div></div></div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-label="このページの書き方">
  <div class="in">
    <div class="sh"><b>このページの書き方</b><button class="hbtn" id="sheetClose" type="button">閉じる</button></div>
    <p class="ex"></p>
    <pre id="srcView"></pre>
  </div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="warp" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.012 0.035" numOctaves="2" seed="3"/>
    <feDisplacementMap id="disp" in="SourceGraphic" scale="0" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<script>
/* 親（読む画面）とのやりとり：
   読む画面 → ここ  { type:'fx-load', pages:[…], start:0, title:'', opts:{ fx:true, sound:false, vibrate:false } }
   ここ → 読む画面  { type:'fx-ready' } / { type:'fx-page', i, n } / { type:'fx-close' } */
(function () {
  const post = m => { try { parent.postMessage(m, '*'); } catch (e) {} };
  let loaded = false, opts = {};
  document.getElementById('fxBack').onclick = () => post({ type: 'fx-close' });
  window.addEventListener('message', e => {
    const d = e.data; if (!d || d.type !== 'fx-load' || loaded) return;
    loaded = true; opts = d.opts || {};
    window.BOOK = { start: 1, silDefault: false, showTitle: false, pages: (d.pages && d.pages.length) ? d.pages : ['（本文がありません）'] };
    // 振動は、許したときだけ
    if (!opts.vibrate) { try { Object.defineProperty(navigator, 'vibrate', { value: () => false, configurable: true }); } catch (x) {} }
    const s = document.createElement('script'); s.src = 'fx.js';
    s.onload = () => {
      const bridge = document.createElement('script'); bridge.src = 'line-maker-bridge.js';
      bridge.onload = () => {
      const docs=document.createElement('script');docs.src='document-bridge.js';docs.onload=()=>{
      try {
        S.pvMute = !opts.sound;                       // 音は、はじめは出さない
        document.querySelector('.hd .ttl').textContent = d.title || '';
        document.getElementById(opts.fx === false ? 'no' : 'yes').click();
        if (d.start > 0) setTimeout(() => { try { goto(Math.min(d.start, BOOK.pages.length - 1), { push: false }); } catch (x) {} }, 120);
      } catch (x) { post({ type: 'fx-error', message: String(x && x.message || x) }); }
      let last = -1;
      setInterval(() => { try { if (typeof S !== 'undefined' && S.cur != null && S.cur !== last) { last = S.cur; post({ type: 'fx-page', i: S.cur, n: BOOK.pages.length }); } } catch (x) {} }, 400);
    };
      docs.onerror=()=>post({type:'fx-error',message:'手紙・調査票の演出を読み込めませんでした'});document.body.appendChild(docs);
      };
      bridge.onerror = () => post({ type: 'fx-error', message: 'トークメーカーの接続を読み込めませんでした' });
      document.body.appendChild(bridge);
    };
    s.onerror = () => post({ type: 'fx-error', message: 'fx.js を読み込めませんでした' });
    document.body.appendChild(s);
  });
  post({ type: 'fx-ready' });
})();
</script>
</body>
</html>
