<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>報道メーカーの見え方</title>
<link rel="stylesheet" href="news-style.css">
<style>
  html, body { margin: 0; background: #f3ece0; }
  body { padding: 12px; font-family: "Shippori Mincho", "Yu Mincho", serif; color: #3b332b; }
  .fxnews { margin: 0; }
</style>
<script src="news-reader.js"></script>
</head>
<body>
<!-- 報道メーカー（news-maker.html）の中で、読む画面と同じ表示（news-reader.js）を出す画面。
   親 → ここ  { type:'fx-make', src, sound }　／　ここ → 親  { type:'fx-ready' } -->
<div class="fxnews" id="box"></div>
<script>
(function () {
  const post = m => { try { parent.postMessage(m, '*'); } catch (e) {} };
  let run = null;
  window.addEventListener('message', e => {
    const d = e.data; if (!d || d.type !== 'fx-make') return;
    run?.cancel();
    const box = document.getElementById('box');
    box.innerHTML = NewsReader.html(d.src || '', { base: '' }) || '<p style="color:#8a7a68;font:13px sans-serif">（まだ何も入っていません）</p>';
    run = NewsReader.play(box, { sound: !!d.sound });
  });
  post({ type: 'fx-ready' });
})();
</script>
</body>
</html>
